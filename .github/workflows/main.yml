name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      INFLUX_URL: ${{ secrets.INFLUX_URL }}
      INFLUX_SENSOR_TOKEN: ${{ secrets.INFLUX_SENSOR_TOKEN }}
      INFLUX_ALERTS_TOKEN: ${{ secrets.INFLUX_ALERTS_TOKEN }}
      INFLUX_SENSOR_DB: ${{ secrets.INFLUX_SENSOR_DB }}
      INFLUX_ALERTS_DB: ${{ secrets.INFLUX_ALERTS_DB }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t spikestop-dashboard .

      - name: Push Docker image
        run: docker tag spikestop-dashboard turbonatee/spikestop-dashboard:latest
      - run: docker push turbonatee/spikestop-dashboard:latest

      - name: SSH & deploy on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull turbonatee/spikestop-dashboard:latest
            docker stop spikestop-dashboard || true
            docker rm spikestop-dashboard || true
            docker run -d -p 3000:3000 --env-file /home/ubuntu/.env spikestop-dashboard
